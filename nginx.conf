server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;
    gzip_min_length 1024;

    # Content is immutable per image tag, so assets can be cached hard. HTML is not, or a
    # deploy would not be visible until browsers expired it.
    location ~* \.(css|js|webp|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
